services:
  - type: web
    name: marketops-logistics-dashboard
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_SOURCE
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
